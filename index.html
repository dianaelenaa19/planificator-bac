<!DOCTYPE html>
<html lang="ro">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Planificator Bacalaureat</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <header>
    <h1>Planificator Bacalaureat</h1>
    <nav>
      <button data-sectiune="azi" class="activ">Azi</button>
      <button data-sectiune="materii">Materii</button>
      <button data-sectiune="calendar">Calendar</button>
      <button data-sectiune="statistici">Statistici</button>
    </nav>
  </header>

  <main>
    <section id="azi">
      <h2>Azi</h2>
      <p>Aici vor apărea capitolele de repetat azi.</p>
    </section>

    <section id="materii" hidden>
      <h2>Materii</h2>

      <form id="form-materie">
        <label>
          Nume materie
          <input type="text" id="materie-nume" placeholder="de ex. Matematică" required>
        </label>

        <label>
          Data examenului
          <input type="date" id="materie-data" required>
        </label>

        <label>
          Importanță
          <select id="materie-importanta">
            <option value="1">1 - mică</option>
            <option value="2">2</option>
            <option value="3" selected>3 - medie</option>
            <option value="4">4</option>
            <option value="5">5 - foarte mare</option>
          </select>
        </label>

        <div class="butoane-formular">
          <button type="submit" id="materie-salveaza">Adaugă materia</button>
          <button type="button" id="materie-anuleaza" hidden>Anulează</button>
        </div>
      </form>

      <p id="materie-mesaj" class="mesaj-eroare"></p>

      <ul id="lista-materii"></ul>

      <div id="zona-capitole">
        <h3>Capitole</h3>

        <label class="alege-materie">
          Materia
          <select id="capitol-materie"></select>
        </label>

        <form id="form-capitol">
          <label>
            Nume capitol
            <input type="text" id="capitol-nume" placeholder="de ex. Funcții" required>
          </label>

          <label>
            Cât de bine îl știu
            <select id="capitol-incredere">
              <option value="1">1 - deloc</option>
              <option value="2">2 - puțin</option>
              <option value="3" selected>3 - mediu</option>
              <option value="4">4 - bine</option>
              <option value="5">5 - foarte bine</option>
            </select>
          </label>

          <div class="butoane-formular">
            <button type="submit" id="capitol-salveaza">Adaugă capitolul</button>
            <button type="button" id="capitol-anuleaza" hidden>Anulează</button>
          </div>
        </form>

        <details>
          <summary>Adaugă mai multe capitole deodată</summary>
          <form id="form-masa">
            <label class="lat">
              Câte un capitol pe linie
              <textarea id="capitole-text" rows="6" placeholder="Funcții&#10;Șiruri&#10;Probabilități"></textarea>
            </label>

            <label>
              Încredere pentru toate
              <select id="masa-incredere">
                <option value="1">1 - deloc</option>
                <option value="2">2 - puțin</option>
                <option value="3" selected>3 - mediu</option>
                <option value="4">4 - bine</option>
                <option value="5">5 - foarte bine</option>
              </select>
            </label>

            <div class="butoane-formular">
              <button type="submit">Adaugă toate capitolele</button>
            </div>
          </form>
        </details>

        <p id="capitol-mesaj" class="mesaj-eroare"></p>

        <ul id="lista-capitole"></ul>
      </div>
    </section>

    <section id="calendar" hidden>
      <h2>Calendar</h2>
      <p>Aici va apărea calendarul cu planul.</p>
    </section>

    <section id="statistici" hidden>
      <h2>Statistici</h2>
      <p>Aici vor apărea graficele.</p>
    </section>
  </main>

  <script type="module" src="js/main.js"></script>
</body>
</html>
